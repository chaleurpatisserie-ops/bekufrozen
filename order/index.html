    var o=fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=4&lat=1.4927&lon=103.7414&bbox=103.35,1.25,104.25,1.75&lang=en').then(function(r){return r.json()}).then(function(j){
      return(j.features||[]).filter(function(f){var p=f.properties||{};return p.countrycode==='MY'||p.country==='Malaysia'}).map(function(f){var p=f.properties||{};var street=[p.housenumber,p.street].filter(Boolean).join(' ');
        var t1=p.name||street||p.district||p.city||'';var t2=[p.name&&street?street:'',p.district||p.locality,p.postcode,p.city||p.county].filter(Boolean).filter(function(x,i,a){return a.indexOf(x)===i&&x!==t1}).join(', ');
        return{t1:t1,t2:t2,addr:[p.name,street,p.district||p.locality].filter(Boolean).filter(function(x,i,a){return a.indexOf(x)===i}).join(', '),pc:p.postcode?String(p.postcode).replace(/\D/g,'').slice(0,5):'',city:p.city||p.county||''}})}).catch(function(){return[]});
    Promise.all([g,o]).then(function(rs){if(n!==sugN)return;var inp=document.getElementById('f_addr');if(!inp)return;closeSug();
      var seen={},all=rs[0].concat(rs[1]).filter(function(x){var k=(x.t1+'|'+x.t2).toLowerCase();if(!x.t1||seen[k])return false;seen[k]=1;return true}).slice(0,7);if(!all.length)return;
      var box=document.createElement('div');box.id='sug';box.className='sug';box.setAttribute('role','listbox');
      all.forEach(function(x){var b=document.createElement('button');b.type='button';b.setAttribute('role','option');
        b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17558c" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span><b>'+esc(x.t1)+'</b><span>'+esc(x.t2)+'</span></span>';
        b.addEventListener('click',function(e){e.stopPropagation();st.f.addr=x.addr;if(x.pc)st.f.postcode=x.pc;if(x.city)st.f.city=x.city;closeSug();render();var a=document.getElementById('f_addr');if(a){a.focus();a.setSelectionRange(0,0)}});
        box.appendChild(b)});
      if(rs[1].length){var src=document.createElement('div');src.className='src';src.textContent='Results from Google and © OpenStreetMap contributors';box.appendChild(src)}
      inp.parentNode.appendChild(box)})},450)}

      .concat([r.fee?L('del')+': '+rm(r.fee):'',L('waTot')+': '+rm(r.total),'',v('company')+' · SSM '+v('ssm'),v('contact')+' · '+v('phone'),[v('addr'),v('postcode'),v('city')].join(', '),L('date')+': '+v('date').split('-').reverse().join('/'),'',L('waPay')]).filter(function(x,i,a){return x!==''||a[i-1]!==''}).join('\n');
